spring:
  application:
    name: inventory-backend

  # ============================================================
  # DATABASE — Setup Person: replace these with Aiven credentials
  # ============================================================
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Prevent data.sql from running every restart (run it manually once)
  sql:
    init:
      mode: never

  # ============================================================
  # AI — AI Person: set your OpenAI key as environment variable
  # In IntelliJ: Run → Edit Configurations → Environment Variables
  # Add: OPENAI_API_KEY=sk-your-key-here
  # ============================================================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7

# ============================================================
# JWT — Don't change this, it works as-is
# ============================================================
jwt:
  secret: vcube-hack-quest-2026-super-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000

server:
  port: 8080
